# Runs on push and pull request once this repository has a remote.
#
# There is no remote yet, so this file is dormant: it exists so the test suite
# becomes a gate the moment one is added, rather than something that has to be
# remembered. `scripts/verify.ps1` is the same set of checks for local use.
#
# The backend tests need SQL Server. The service container below is the Linux
# image of SQL Server 2022, which is close enough for the ORM — the three
# behaviours this project depends on (bulk_create returning no primary keys,
# UPDLOCK on select_for_update, a case-insensitive default collation) are the
# engine's, not the platform's. The collation is set explicitly because the Linux
# image defaults differently from a Windows install, and `icontains` searches
# depend on it.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'Str0ng!Passw0rd' }}
          MSSQL_COLLATION: SQL_Latin1_General_CP1_CI_AS
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install the ODBC driver
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/prod.list \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Create the database
        env:
          SA_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'Str0ng!Passw0rd' }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" \
            -Q "CREATE DATABASE LMS COLLATE SQL_Latin1_General_CP1_CI_AS;"

      - name: Django checks
        working-directory: backend
        env: &dbenv
          DB_NAME: LMS
          DB_HOST: localhost
          DB_PORT: '1433'
          DB_USER: sa
          DB_PASSWORD: ${{ secrets.CI_SA_PASSWORD || 'Str0ng!Passw0rd' }}
          DB_TRUSTED_CONNECTION: '0'
          DB_TRUST_SERVER_CERT: '1'
          DB_DRIVER: ODBC Driver 18 for SQL Server
          SECRET_KEY: ci-only-not-a-secret
          DEBUG: '0'
        run: python manage.py check

      # A model change with no migration breaks nothing locally — the test
      # database is built from migrations and a missing index fails no assertion —
      # and then fails on the next person's machine.
      - name: No missing migrations
        working-directory: backend
        env: *dbenv
        run: python manage.py makemigrations --check --dry-run core

      - name: Tests
        working-directory: backend
        env: *dbenv
        run: python manage.py test --verbosity 2

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: No known vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=moderate
